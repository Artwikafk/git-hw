version: '3.8'

services:
  web1:
    build: .
    container_name: web1
    hostname: web1
    ports:
      - "2222:22"
    networks:
      ansible-net:
        ipv4_address: 10.97.0.10
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    restart: unless-stopped

  web2:
    build: .
    container_name: web2
    hostname: web2
    ports:
      - "2200:22"
    networks:
      ansible-net:
        ipv4_address: 10.97.0.11
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    restart: unless-stopped

networks:
  ansible-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.0.0/16