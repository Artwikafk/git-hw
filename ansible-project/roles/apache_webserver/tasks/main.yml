---
- name: Install Apache web server
  apt:
    name: "{{ apache_service_name }}"
    state: present
    update_cache: yes

- name: Ensure Apache is enabled and started
  systemd:
    name: "{{ apache_service_name }}"
    state: started
    enabled: yes
    daemon_reload: yes

- name: Create custom index.html with system facts
  template:
    src: index.html.j2
    dest: "{{ apache_docroot }}/index.html"
    mode: '0644'
    owner: root
    group: root
    backup: yes
  notify: Restart Apache

- name: Verify web server is accessible (HTTP 200)
  uri:
    url: "http://{{ ansible_default_ipv4.address }}:{{ apache_port }}"
    method: GET
    status_code: 200
    timeout: 10
  register: http_check
  until: http_check.status == 200
  retries: 5
  delay: 5

- name: Display verification result
  debug:
    msg: |
      ✅ Web server is running on {{ ansible_hostname }}!
      URL: http://{{ ansible_default_ipv4.address }}:{{ apache_port }}
      Status: {{ http_check.status }}
      Content length: {{ http_check.content | length }} bytes