---
- name: Install Apache web server
  apt:
    name: apache2
    state: present
    update_cache: yes

- name: Ensure Apache is enabled and started
  service:
    name: apache2
    state: started
    enabled: yes
  ignore_errors: yes

- name: Start Apache directly if service module fails
  shell: |
    if ! pgrep -f "apache2" > /dev/null; then
      /usr/sbin/apache2ctl start
      echo "Apache started"
    fi
  register: apache_start
  changed_when: "'Apache started' in apache_start.stdout"
  when: ansible_virtualization_type == "docker"

- name: Create custom index.html with system facts
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: '0644'
    owner: root
    group: root
    backup: yes
  notify: Restart Apache

- name: Verify web server is accessible (HTTP 200) via localhost
  uri:
    url: "http://localhost"
    method: GET
    status_code: 200
    timeout: 10
  register: http_check
  until: http_check.status == 200
  retries: 5
  delay: 5

- name: Display verification result
  debug:
    msg: |
      ✅ Web server is running on {{ ansible_hostname }}!
      Status: {{ http_check.status }}